name: Auto Tag from pom.xml

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: mvn -B -ntp clean verify

      - name: Get latest release tag
        id: get_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --tags

          latest=$(
            git tag --list |
            sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
            sort -V |
            tail -n 1
          )

          latest="${latest:-0.0.0}"

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest release version: $latest"

      - name: Extract version from pom.xml
        id: pom_version
        shell: bash
        run: |
          set -euo pipefail

          version_file="$RUNNER_TEMP/auto-tag-pom-version.txt"
          rm -f "$version_file"

          mvn -B -ntp help:evaluate \
            -Dexpression=project.version \
            -Doutput="$version_file"

          version=$(tr -d '\r\n' < "$version_file")

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-SNAPSHOT)?$ ]]; then
            echo "::error::Invalid POM version: $version. Expected X.Y.Z or X.Y.Z-SNAPSHOT."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "POM version: $version"

      - name: Calculate new tag
        id: new_tag
        shell: bash
        env:
          LATEST_VERSION: ${{ steps.get_tag.outputs.latest }}
          POM_VERSION: ${{ steps.pom_version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import subprocess

          def parse_version(value):
              return tuple(int(part) for part in value.split("."))

          latest = parse_version(os.environ["LATEST_VERSION"])
          pom_text = os.environ["POM_VERSION"].removesuffix("-SNAPSHOT")
          pom = parse_version(pom_text)
          is_push = os.environ["GITHUB_EVENT_NAME"] == "push"

          # Re-running a successful release must not create another version
          # for the same commit.
          existing_tag = None

          if is_push:
              tags_on_head = subprocess.check_output(
                  ["git", "tag", "--points-at", "HEAD"],
                  text=True
              ).splitlines()

              release_tags = [
                  tag for tag in tags_on_head
                  if re.fullmatch(r"v?\d+\.\d+\.\d+", tag)
              ]

              if release_tags:
                  existing_tag = max(
                      release_tags,
                      key=lambda tag: parse_version(tag.removeprefix("v"))
                  )

          if existing_tag:
              new_tag = existing_tag
              skip_create = "true"
          else:
              # Preserve the patch-increment behavior:
              # same major/minor => use the larger of POM patch or latest + 1.
              if pom[:2] == latest[:2]:
                  version = (
                      pom[0],
                      pom[1],
                      max(pom[2], latest[2] + 1)
                  )
              elif pom > latest:
                  version = pom
              else:
                  raise SystemExit(
                      f"POM version {pom_text} is older than the latest "
                      f"release {os.environ['LATEST_VERSION']}. "
                      "Update pom.xml before tagging."
                  )

              base_tag = ".".join(map(str, version))

              if is_push:
                  new_tag = base_tag
              else:
                  pr_number = os.environ["PR_NUMBER"]
                  if not pr_number.isdigit():
                      raise SystemExit("Missing or invalid PR number.")

                  new_tag = f"{base_tag}-SNAPSHOT-pr-{pr_number}"

              skip_create = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"new_tag={new_tag}\n")
              output.write(f"skip_create={skip_create}\n")

          print(f"Tag: {new_tag}")
          print(f"Skip creation: {skip_create}")
          PY

      - name: Create tag
        if: steps.new_tag.outputs.skip_create != 'true'
        shell: bash
        env:
          TAG: ${{ steps.new_tag.outputs.new_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git check-ref-format "refs/tags/$TAG"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            remote_tag=$(git ls-remote --refs origin "refs/tags/$TAG")

            if [[ -n "$remote_tag" ]]; then
              echo "::error::Release tag $TAG already exists."
              exit 1
            fi

            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            # Snapshot tags follow the latest PR commit.
            git tag -fa "$TAG" -m "Snapshot $TAG"
            git push --force origin "refs/tags/$TAG:refs/tags/$TAG"
          fi

          echo "Published tag: $TAG"

      - name: Comment on PR with version
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.new_tag.outputs.new_tag }}
        with:
          script: |
            const tag = process.env.TAG;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Snapshot tag created/updated:** \`${tag}\``
            });

  delete-snapshot-tag:
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Delete PR snapshot tags
        id: cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const suffix = `-SNAPSHOT-pr-${pr.number}`;
            const pattern = /^\d+\.\d+\.\d+-SNAPSHOT-pr-\d+$/;

            const refs = await github.paginate(
              github.rest.git.listMatchingRefs,
              {
                owner,
                repo,
                ref: "tags/"
              }
            );

            const matchingRefs = refs.filter(item => {
              const tag = item.ref.replace(/^refs\/tags\//, "");
              return pattern.test(tag) && tag.endsWith(suffix);
            });

            const deleted = [];

            for (const item of matchingRefs) {
              const ref = item.ref.replace(/^refs\//, "");

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref
              });

              const tag = item.ref.replace(/^refs\/tags\//, "");
              deleted.push(tag);
              core.info(`Deleted snapshot tag: ${tag}`);
            }

            core.setOutput("deleted_tags", deleted.join("\n"));

      - name: Delete branch after merge
        id: delete_branch
        if: github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            const { data: repository } = await github.rest.repos.get({
              owner,
              repo
            });

            if (
              branch === repository.default_branch ||
              branch === pr.base.ref
            ) {
              core.info(`Skipping default/base branch: ${branch}`);
              return;
            }

            // Check separately so an already-deleted branch is harmless.
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch already deleted: ${branch}`);
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${branch}`
            });

            core.setOutput("deleted_branch", branch);
            core.info(`Deleted branch: ${branch}`);

      - name: Comment on PR cleanup
        if: >-
          steps.cleanup.outputs.deleted_tags != '' ||
          steps.delete_branch.outputs.deleted_branch != ''
        uses: actions/github-script@v7
        env:
          DELETED_TAGS: ${{ steps.cleanup.outputs.deleted_tags }}
          DELETED_BRANCH: ${{ steps.delete_branch.outputs.deleted_branch }}
        with:
          script: |
            const lines = [];

            if (process.env.DELETED_TAGS) {
              lines.push(
                "**Snapshot tags deleted:**",
                "```",
                process.env.DELETED_TAGS,
                "```"
              );
            }

            if (process.env.DELETED_BRANCH) {
              lines.push(
                `**Branch deleted:** \`${process.env.DELETED_BRANCH}\``
              );
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join("\n")
            });
